<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="description" content="Ôn trắc nghiệm Lịch sử Đảng Cộng sản Việt Nam với 432 câu VNR202, thẻ ghi nhớ và vòng ôn câu sai.">
  <title>VNR202 · Ôn đến khi thuộc</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
  <script defer src="bo-cau-hoi.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#home" aria-label="VNR202, tổng quan">
        <span class="brand-icon" id="brand-icon"></span>
        <span><strong>VNR202</strong><small>Phòng ôn tập</small></span>
      </a>
      <nav id="nav" aria-label="Điều hướng"></nav>
      <div class="local-info">
        <span id="storage-icon"></span>
        <p>Tiến độ được lưu trên<br>trình duyệt này.</p>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <span class="top-title" id="top-title">Tổng quan</span>
        <div class="top-actions">
          <span class="course-label" id="course-label"></span>
          <button class="btn outline theme-toggle" id="theme-toggle" type="button" aria-label="Chuyển sang giao diện tối" hidden>
            <svg class="theme-moon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.8 14.4A9 9 0 0 1 9.6 3.2 9 9 0 1 0 20.8 14.4Z"/>
            </svg>
            <svg class="theme-sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19m0-14-1.5 1.5m-11 11L5 19"/>
            </svg>
            <span id="theme-label">Tối</span>
          </button>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
      <footer class="footer">Nguồn câu hỏi · VNR202 – Chuẩn Nhung Hoàng</footer>
    </div>
  </div>
  <div id="announce" class="sr-only" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
